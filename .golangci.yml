---
version: "2"

linters:
  enable:
    - misspell
    - revive
  settings:
    errcheck:
      exclude-functions:
        # Never check for logger errors.
        - (github.com/go-kit/log.Logger).Log
    revive:
      rules:
        # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#unused-parameter
        - name: unused-parameter
          severity: warning
          disabled: true
  exclusions:
    rules:
      - path: _test.go
        linters:
          - errcheck
